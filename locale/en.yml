lowseekai-content-risk-fee:
  forum:
    modal:
      title: Publishing reminder
      risk_title: Publishing rule matched
      risk_message: This content contains an external link or sensitive content that needs confirmation. The content will remain unchanged and will be published after confirmation.
      risk_type: Matched type
      risk_value: External link or sensitive content
      fee: Charge
      balance_after: Balance after charge
      insufficient: You do not have enough points to publish this content.
