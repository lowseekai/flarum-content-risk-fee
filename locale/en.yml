      sensitive_words: Sensitive word list
      sensitive_words_help: Enter one word per line or separate words with commas. The rules are never sent to the browser.
      custom_regex: Custom regular expressions
      custom_regex_help: Enter one expression per line, with or without delimiters.
      duplicate_enabled: Enable duplicate-content detection
      duplicate_window_hours: Duplicate detection window in hours
      duplicate_block_after: Block after this many occurrences
    permissions:
      bypass: Bypass external-link and sensitive-content charges
